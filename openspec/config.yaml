schema: spec-driven

# Project context
context: |
  Tech stack: Python >=3.10, uv, Playwright (sync API), httpx, PyYAML, pytest.
  Domain: web discovery for new Odoo consulting clients (Escodoo). Two stages:
  the CLI collects raw public data; the /discovery skill structures it.
  Conventions: specs and docs in Portuguese; collectors never interpret data;
  a failing source is recorded in the raw data and never aborts a run; only
  public sources, no logins (no LinkedIn); reports/ is gitignored (client data).

